# Fictalent RH · a plataforma de dados inteira em containers.
#
# Sete serviços de longa duração e um job de inicialização:
#   mysql-staging   MySQL · a réplica autorizada do sistema do cliente, de onde o pipeline lê
#   pg-dw           Postgres · o warehouse dimensional (OLAP)
#   pg-dagster      Postgres · metadados do Dagster (execuções, eventos, agendas)
#   s3              SeaweedFS · armazenamento compatível com S3 para o lake
#   s3-init         job único · cria o bucket do lake e termina
#   dagster-web     Dagster · interface web e API GraphQL
#   dagster-daemon  Dagster · agendas, sensores e fila de execuções
#   grafana         Grafana · monitoramento e alertas
#
# O sistema produtivo do cliente não está aqui: a consultoria nunca o toca. O que existe
# é a réplica (staging), e é dela que saem as cargas. Por que MySQL na réplica e Postgres
# no warehouse: docs/adr/0001-mysql-no-staging-postgres-no-olap.md
#
# Regras deste arquivo (conferidas por tests/test_compose.py):
#   - toda imagem com versão exata, nunca "latest";
#   - todo serviço de longa duração com healthcheck e política de reinício;
#   - portas publicadas só em 127.0.0.1 (nada fica exposto na rede);
#   - nenhuma senha escrita aqui: tudo vem do .env, e a falta derruba a subida;
#   - containers sem ganho de privilégio (no-new-privileges).
#
# Operação (subir, parar, reiniciar, verificar): docs/08_manual_de_operacao.md

name: fictalent

x-seguranca: &seguranca
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-saude: &saude
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  # ─────────────────────────── staging: a réplica do cliente ───────────────────────────
  mysql-staging:
    <<: *seguranca
    image: mysql:8.4.11
    container_name: fictalent_mysql_staging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --local-infile=0
      - --skip-name-resolve
      - --default-time-zone=+00:00
    environment:
      # em MySQL, schema e database são a mesma coisa: os 10 módulos viram 10 databases,
      # criados pela DDL em staging/ddl na primeira inicialização; os usuários por perfil
      # vêm com o DCL (card 2.4)
      MYSQL_ROOT_PASSWORD: ${STAGING_ROOT_PASSWORD:?defina STAGING_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:${STAGING_PORT:-3316}:3306"
    volumes:
      - mysql_staging:/var/lib/mysql
      - ./staging/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *saude
      start_period: 60s
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
    deploy:
      resources:
        limits:
          memory: 2g

  # ─────────────────────────────── bancos Postgres ───────────────────────────────
  pg-dw:
    <<: *seguranca
    image: postgres:16.15-alpine
    container_name: fictalent_pg_dw
    environment:
      POSTGRES_DB: ${DW_DB:-dw_fictalent}
      POSTGRES_USER: ${DW_ADMIN_USER:-fictalent_admin}
      POSTGRES_PASSWORD: ${DW_ADMIN_PASSWORD:?defina DW_ADMIN_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      GRAFANA_LEITOR_PASSWORD: ${GRAFANA_LEITOR_PASSWORD:?defina GRAFANA_LEITOR_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DW_PORT:-5441}:5432"
    volumes:
      - pg_dw:/var/lib/postgresql/data
      - ./infra/postgres/dw:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *saude
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    deploy:
      resources:
        limits:
          memory: 2g

  pg-dagster:
    <<: *seguranca
    image: postgres:16.15-alpine
    container_name: fictalent_pg_dagster
    environment:
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
      POSTGRES_USER: ${DAGSTER_PG_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:?defina DAGSTER_PG_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      GRAFANA_LEITOR_PASSWORD: ${GRAFANA_LEITOR_PASSWORD:?defina GRAFANA_LEITOR_PASSWORD no .env}
    # sem porta publicada: só o Dagster e o Grafana conversam com ele, pela rede interna
    volumes:
      - pg_dagster:/var/lib/postgresql/data
      - ./infra/postgres/dagster:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *saude
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    deploy:
      resources:
        limits:
          memory: 512m

  # ─────────────────────────────── lake (S3) ───────────────────────────────
  s3:
    <<: *seguranca
    image: chrislusf/seaweedfs:4.47
    container_name: fictalent_s3
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    # a identidade S3 é gerada no arranque a partir do .env, fora de qualquer arquivo versionado
    entrypoint: ["/bin/sh", "/infra/iniciar.sh"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3_dados:/data
      - ./infra/seaweedfs/iniciar.sh:/infra/iniciar.sh:ro
    healthcheck:
      <<: *saude
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz"]
    deploy:
      resources:
        limits:
          memory: 1g

  s3-init:
    image: chrislusf/seaweedfs:4.47
    container_name: fictalent_s3_init
    security_opt:
      - no-new-privileges:true
    restart: "no"
    environment:
      S3_BUCKET: ${S3_BUCKET:-fictalent-lake}
    entrypoint: ["/bin/sh", "/infra/criar_bucket.sh"]
    volumes:
      - ./infra/seaweedfs/criar_bucket.sh:/infra/criar_bucket.sh:ro
    depends_on:
      s3:
        condition: service_healthy

  # ─────────────────────────────── orquestração ───────────────────────────────
  dagster-web:
    <<: *seguranca
    build:
      context: .
      dockerfile: infra/dagster/Dockerfile
    image: fictalent/dagster:0.2.0
    container_name: fictalent_dagster_web
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/app/workspace.yaml"]
    environment: &ambiente_dagster
      DAGSTER_PG_HOST: pg-dagster
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:?defina DAGSTER_PG_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DAGSTER_PORT:-3010}:3000"
    volumes:
      - dagster_logs:/opt/dagster/home/logs
    healthcheck:
      <<: *saude
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=4)"]
    depends_on:
      pg-dagster:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  dagster-daemon:
    <<: *seguranca
    image: fictalent/dagster:0.2.0
    container_name: fictalent_dagster_daemon
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/app/workspace.yaml"]
    environment: *ambiente_dagster
    volumes:
      - dagster_logs:/opt/dagster/home/logs
    healthcheck:
      <<: *saude
      start_period: 60s
      test: ["CMD", "dagster-daemon", "liveness-check"]
    depends_on:
      pg-dagster:
        condition: service_healthy
      dagster-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  # ─────────────────────────────── observabilidade ───────────────────────────────
  grafana:
    <<: *seguranca
    image: grafana/grafana-oss:13.0.2
    container_name: fictalent_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_MODE: console
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DW_DB: ${DW_DB:-dw_fictalent}
      GRAFANA_LEITOR_PASSWORD: ${GRAFANA_LEITOR_PASSWORD:?defina GRAFANA_LEITOR_PASSWORD no .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3011}:3000"
    volumes:
      - grafana_dados:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      <<: *saude
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
    depends_on:
      pg-dagster:
        condition: service_healthy
      pg-dw:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  mysql_staging:
  pg_dw:
  pg_dagster:
  s3_dados:
  dagster_logs:
  grafana_dados:
