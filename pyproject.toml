[project]
name = "rh-fictalent-bigdata"
version = "0.1.0"
description = "Pipeline de dados ponta a ponta da Fictalent RH (empresa ficticia, dados sinteticos): relacional modular -> backfill + incremental -> bronze/silver/gold -> multidimensional."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "adbc-driver-manager>=1.12.0",
    "adbc-driver-postgresql>=1.12.0",
    "duckdb>=1.5.5",
    "fsspec>=2026.7.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ipykernel>=7.3.0",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rh_fictalent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "0.1.0"
strict = true
packages = ["rh_fictalent"]
mypy_path = "src"

[[tool.mypy.overrides]]
# bibliotecas sem stubs publicados (py.typed ausente); o resto do projeto segue strict
module = ["fsspec.*", "pyarrow.*", "adbc_driver_postgresql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
