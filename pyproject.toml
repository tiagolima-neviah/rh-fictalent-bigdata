[project]
name = "rh-fictalent-bigdata"
version = "0.5.0"
description = "Pipeline de dados ponta a ponta da Fictalent RH (empresa ficticia, dados sinteticos): relacional modular -> backfill + incremental -> bronze/silver/gold -> multidimensional."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "adbc-driver-manager>=1.12.0",
    "dagster==1.13.22",
    "dagster-postgres==0.29.22",
    "dagster-webserver==1.13.22",
    "adbc-driver-postgresql>=1.12.0",
    "duckdb>=1.1",
    "fsspec>=2026.7.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.0",
    "pymysql>=1.2.0",
    "s3fs>=2026.7.0",
    "py7zr>=1.1.3",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandera>=0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ipykernel>=7.3.0",
    "types-pymysql>=1.2.0.20260807",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pandas-stubs>=3.0.5.260914",
    "types-openpyxl>=3.1.5.20260827",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rh_fictalent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# bibliotecas sem stubs publicados (py.typed ausente); o resto do projeto segue strict
module = ["fsspec.*", "s3fs.*", "pyarrow.*", "adbc_driver_postgresql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# o código do produto é o que se audita; os testes usam assert e subprocess de propósito
exclude_dirs = ["tests", ".venv"]
