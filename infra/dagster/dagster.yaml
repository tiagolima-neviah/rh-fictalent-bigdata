# Configuração da instância do Dagster.
# Metadados (execuções, eventos, agendas) ficam no Postgres dedicado, não em arquivo local:
# é o que permite webserver e daemon enxergarem o mesmo estado e o Grafana ler o histórico.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/home/logs

telemetry:
  enabled: false

# Logs: os loggers rh_fictalent.* são gerenciados pelo Dagster, então o que o código do
# projeto loga dentro de uma execução passa pelo logger do job (JSON, ver
# rh_fictalent.orquestracao.logger_json) e aparece na interface.
python_logs:
  python_log_level: INFO
  managed_python_loggers:
    - rh_fictalent
