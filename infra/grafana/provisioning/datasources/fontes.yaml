# Fontes de dados do Grafana, provisionadas como código.
# As senhas chegam por variável de ambiente ($GRAFANA_LEITOR_PASSWORD), nunca escritas aqui.
# Ambas usam o papel SÓ DE LEITURA criado na inicialização de cada banco
# (infra/postgres/dagster e infra/postgres/dw). A réplica do cliente (MySQL) não é
# fonte do Grafana: ele fica na observabilidade, e execução e frescor moram nestes dois.
apiVersion: 1

datasources:
  - name: Dagster (metadados de execução)
    uid: dagster-metadados
    type: grafana-postgresql-datasource
    access: proxy
    url: pg-dagster:5432
    user: grafana_leitor
    editable: false
    jsonData:
      database: ${DAGSTER_PG_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${GRAFANA_LEITOR_PASSWORD}

  - name: Warehouse (Postgres)
    uid: warehouse-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: pg-dw:5432
    user: grafana_leitor
    editable: false
    jsonData:
      database: ${DW_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${GRAFANA_LEITOR_PASSWORD}
